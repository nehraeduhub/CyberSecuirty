services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
  web:
    build: ./backend
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: [staticdata:/app/staticfiles]
    restart: unless-stopped
  frontend:
    build: ./frontend
    restart: unless-stopped
  meshcentral:
    image: ${MESHCENTRAL_IMAGE:-ghcr.io/ylianst/meshcentral:1.2.6}
    environment:
      DYNAMIC_CONFIG: "false"
      HOSTNAME: ${MESH_HOSTNAME}
      PORT: "443"
      REDIR_PORT: "80"
      ALLOW_NEW_ACCOUNTS: "false"
      NODE_ENV: production
      ALLOWED_ORIGIN: ${MESH_ALLOWED_ORIGIN:-false}
      IFRAME: "true"
      LOCAL_SESSION_RECORDING: "true"
      WEBRTC: "false"
      REVERSE_PROXY: "nginx"
      REVERSE_PROXY_TLS_PORT: "443"
      TLS_OFFLOAD: "true"
      TRUSTED_PROXY: "nginx"
    volumes:
      - meshdata:/opt/meshcentral/meshcentral-data
      - meshfiles:/opt/meshcentral/meshcentral-files
      - meshweb:/opt/meshcentral/meshcentral-web
      - meshbackups:/opt/meshcentral/meshcentral-backups
    restart: unless-stopped
  nginx:
    image: nginx:1.29-alpine
    depends_on: [web, frontend, meshcentral]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticdata:/static:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped
volumes:
  pgdata:
  redisdata:
  staticdata:
  meshdata:
  meshfiles:
  meshweb:
  meshbackups:
