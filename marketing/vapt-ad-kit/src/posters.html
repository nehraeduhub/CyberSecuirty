:root{--org:#ffad1f;--grn:#22c55e;--red:#ff3b4e;--cy:#38d6ff;--ink:#e8f0ff;--mut:#b4c6ea}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06142f;color:var(--ink);font-family:Pop,sans-serif;overflow:hidden}

.abs{position:absolute}

.orb{font-family:Orb;font-weight:900}
.o{color:var(--org)}.g{color:var(--grn)}.r{color:var(--red)}.c{color:var(--cy)}
.card{background:linear-gradient(160deg,#12346f,#0a1f48);border:2px solid #2f5fb8;border-radius:24px;box-shadow:0 24px 70px #000a}
.pill{display:inline-block;border-radius:999px;font-weight:800}
.cta{background:var(--org);color:#1a1200;font-weight:800;border-radius:999px;display:inline-block;box-shadow:0 10px 40px #ffad1f55}
.badge{display:inline-block;border:2px solid #4f7fd6;background:#0d2a5e;border-radius:12px;font-family:Grot;font-weight:700}
.by{display:flex;align-items:center;gap:.5em;color:#dfe8ff;font-weight:600}.by b{color:var(--org)}
.tick{display:inline-grid;place-items:center;border-radius:50%;background:var(--grn);color:#052;font-weight:800}
.row{display:flex;align-items:center}
.mono{font-family:Grot}
