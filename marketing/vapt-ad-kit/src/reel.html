.tick{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--grn);color:#062;font:800 38px Pop}
.badge{display:inline-block;padding:14px 26px;border-radius:16px;border:2px solid #4f7fd6;background:#0d2a5e;font:800 40px Grot;margin:10px}

  const pu=(t%1.2)/1.2;$('.btn',e).style.boxShadow=`0 0 0 ${pu*40}px rgba(255,173,31,${.5*(1-pu)})`}}
};

/* ---------- background: moving grid, data particles, scene-tinted glow ---------- */
const bg=document.getElementById('bg'),g=bg.getContext('2d');
const TINT={hook:'#ff3b4e',threats:'#ff3b4e',manual:'#ff7a1a',turn:'#22c55e',intro:'#38d6ff',plug:'#22c55e',vapt:'#38d6ff',confirm:'#22c55e',report:'#ffad1f',sell:'#ffad1f',who:'#38d6ff',triad:'#22c55e',cta:'#ffad1f'};
function drawBg(t,id){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#06142f');gr.addColorStop(1,'#0b2858');g.fillStyle=gr;g.fillRect(0,0,W,H);
  const rg=g.createRadialGradient(540,860,50,540,860,900);rg.addColorStop(0,(TINT[id]||'#38d6ff')+'40');rg.addColorStop(1,'#0000');g.fillStyle=rg;g.fillRect(0,0,W,H);
  g.strokeStyle='#38d6ff14';g.lineWidth=2;const o=(t*40)%90;for(let x=-90+o;x<W+90;x+=90){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=-90+o;y<H;y+=90){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  g.font='700 26px Grot';for(let i=0;i<34;i++){const x=rnd(i)*W,sp=40+rnd(i+50)*90,y=(rnd(i+9)*H+t*sp)%H;g.fillStyle=`rgba(120,200,255,${.08+.15*rnd(i+3)})`;g.fillText(rnd(i+7)>.5?'1':'0',x,y)}}

function ready(){
  document.getElementById('byline').innerHTML=T.byline.replace(/(RJ Nehra)/,'<b>$1</b>');
  const box=document.getElementById('scenes');
  T.scenes.forEach((s,i)=>{const d=document.createElement('div');d.className='sc';d.id='s'+i;d.innerHTML=SC[s.id].html;box.appendChild(d);
    const words=(SUBS[s.id]||'').split(/\s+/),ch=[];let cur=[];for(const w of words){cur.push(w);if(cur.join(' ').length>26||/[.,—…?]$/.test(w)){ch.push(cur.join(' '));cur=[]}}if(cur.length)ch.push(cur.join(' '));
    const tot=ch.reduce((a,c)=>a+c.length,0);let acc=0;s.chunks=ch.map(c=>{const a=s.start+(s.end-s.start)*acc/tot;acc+=c.length;return [a,s.start+(s.end-s.start)*acc/tot,c]})});
}
function render(t){
  let cur=0;T.scenes.forEach((s,i)=>{if(t>=s.start-.25)cur=i});
  T.scenes.forEach((s,i)=>{const el=document.getElementById('s'+i);const st=i?s.start-.25:0,en=s.until-.25;
    if(t<st-.01||t>en+.3){el.style.opacity=0;el.style.display='none';return}el.style.display='block';
    const a=i?io(P(t,st,st+.3)):1,b=i==T.scenes.length-1?1:1-io(P(t,en,en+.3));el.style.opacity=Math.min(a,b);
    el.style.transform=`scale(${1+.04*(1-a)})`;SC[s.id].anim(el,Math.max(0,t-s.start),s.end-s.start)});
  const sc=T.scenes[cur];drawBg(t,sc.id);
  const c=(sc.chunks||[]).find(c=>t>=c[0]-.05&&t<c[1]+.15);document.getElementById('sub').innerHTML=c&&sc.id!=='turn'&&sc.id!=='triad'?`<span>${c[2]}</span>`:'';
  document.getElementById('prog').style.width=(t/T.total*100)+'%';
}
function renderCover(){render(T.scenes[4].start+2.2)}
window.ready=ready;window.render=render;window.renderCover=renderCover;
</script></body></html>
