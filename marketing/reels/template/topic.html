<!doctype html>
<html><head><meta charset="utf-8"><title>Topic reel</title>
<!-- Data-driven topic reel, 1080x1920. tools/render.js injects window.DATA (work/<num>/data.json + asset paths)
     and calls window.render(t) for every frame, or window.renderCover() for the thumbnail.
     Every topic has its own look (topic.look from tools/make-topics.py): theme (colours, fonts, animated background),
     hook / learn / book / ctf / cta / ref layouts, transition, caption style and cover layout, plus a format scene
     ('fact': quiz, myth, compare, mistake, story, tip) and a topic animation (topic.iconAnim). -->
<style>
  @font-face{font-family:'Space Grotesk';font-weight:700;src:url(fonts/space-grotesk-latin-700-normal.woff2)}
  @font-face{font-family:'Bebas Neue';font-weight:400;src:url(fonts/bebas-neue-latin-400-normal.woff2)}
  @font-face{font-family:'Poppins';font-weight:800;src:url(fonts/poppins-latin-800-normal.woff2)}
  @font-face{font-family:'Poppins';font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
  @font-face{font-family:'Oswald';font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2)}
  @font-face{font-family:'Orbitron';font-weight:900;src:url(fonts/orbitron-latin-900-normal.woff2)}
  @font-face{font-family:'Playfair Display';font-weight:900;src:url(fonts/playfair-display-latin-900-normal.woff2)}
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ac:#ff9933;--fg:#fff;--muted:#cfe0ff;--card:rgba(255,255,255,.07);--cardb:rgba(255,255,255,.14);--capbg:rgba(3,10,22,.8);--capfg:#fff;
        --hf:'Inter';--bf:'Inter';--ink:#140c02;--acx:var(--ac)}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#06152b;font-family:var(--bf),'Inter',system-ui,'Noto Color Emoji',sans-serif;color:var(--fg)}
  #bg{position:absolute;inset:0}
  #grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:60px 60px}
  .tri{position:absolute;left:0;right:0;top:0;height:14px;display:flex;z-index:9}
  .tri i{flex:1}.tri i:nth-child(1){background:#ff9933}.tri i:nth-child(2){background:#fff}.tri i:nth-child(3){background:#138808}
  #brand{position:absolute;top:96px;left:70px;display:flex;align-items:center;gap:20px;z-index:8}
  #brand img{width:84px;height:84px;border-radius:20px;background:#fff;padding:6px;object-fit:contain}
  #brand b{display:block;font-size:40px;font-weight:800;letter-spacing:-.5px}
  #brand small{display:block;font-size:22px;color:var(--acx);font-weight:800;letter-spacing:4px;text-transform:uppercase;margin-top:3px}
  #wm{position:absolute;top:118px;right:70px;font:800 28px Inter,sans-serif;color:var(--fg);opacity:.85;padding:10px 20px;border-radius:999px;background:var(--card);border:2px solid var(--cardb);z-index:8}
  #bar{position:absolute;left:70px;right:70px;top:216px;height:6px;border-radius:6px;background:var(--cardb);z-index:8}
  #bar i{display:block;height:100%;border-radius:6px;background:var(--ac)}
  .scene{position:absolute;inset:0}
  .pill{display:inline-flex;align-items:center;gap:12px;background:var(--ac);color:var(--ink);font-weight:900;font-size:30px;letter-spacing:3px;padding:12px 26px;border-radius:999px;text-transform:uppercase;font-family:'Inter'}
  .h1{font-family:var(--hf),'Inter','Noto Color Emoji';line-height:1.06;font-weight:900;letter-spacing:-1.5px}
  .th6 .h1{text-transform:uppercase;letter-spacing:1px;line-height:.98;font-weight:400}
  .th3 .h1{letter-spacing:0}
  em{font-style:normal;color:var(--acx)}
  .head{position:absolute;left:70px;right:70px;top:280px}
  .center{position:absolute;left:70px;right:70px;text-align:center}
  .card{display:flex;align-items:center;gap:30px;padding:36px 38px;margin-bottom:30px;border-radius:30px;background:var(--card);border:2px solid var(--cardb);font-size:44px;font-weight:600;line-height:1.2;position:relative;overflow:hidden}
  .card b{font-weight:900}
  .th5 .card,.th5 .stat,.th5 .tile{box-shadow:0 18px 40px rgba(11,23,48,.12)}
  .th2 .card,.th2 .tile,.th2 .stat{border-style:dashed}
  .card .ck{flex:none;width:76px;height:76px;border-radius:50%;background:var(--ac);color:var(--ink);display:grid;place-items:center;font-size:44px;font-weight:900}
  .num{color:var(--acx);font-weight:900;font-size:30px;letter-spacing:2px;display:block;margin-bottom:6px}
  .chip{display:inline-block;margin:10px 8px;padding:16px 28px;border-radius:999px;background:var(--card);border:2px solid var(--cardb);font-size:34px;font-weight:800}
  .chip.ac{background:var(--ac);color:var(--ink);border-color:var(--ac)}
  .book{position:absolute;border-radius:10px;box-shadow:0 40px 90px rgba(0,0,0,.6);transform-origin:50% 50%}
  .phone{position:absolute;width:500px;height:900px;border-radius:64px;background:#0b0f17;padding:16px;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 3px #2a3550,inset 0 0 0 2px #1b2233}
  .screen{position:relative;width:468px;height:868px;border-radius:50px;overflow:hidden;background:#fff}
  .screen img{position:absolute;left:0;top:56px;width:468px}
  .status{position:absolute;left:0;right:0;top:0;height:56px;background:#fff;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:6px 40px 0;font:700 20px Inter,sans-serif;color:#0b0f17}
  .notch{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:130px;height:36px;border-radius:22px;background:#0b0f17;z-index:5}
  .ring{position:absolute;border:6px solid var(--ac);border-radius:16px;box-shadow:0 0 40px color-mix(in srgb,var(--ac) 80%,transparent);z-index:4}
  .stat{width:370px;padding:24px 28px;margin-bottom:22px;border-radius:26px;background:var(--card);border:2px solid var(--cardb)}
  .stat small{display:block;font-size:24px;letter-spacing:3px;color:var(--muted);font-weight:800;text-transform:uppercase}
  .stat b{display:block;font-size:44px;white-space:nowrap;font-weight:900;margin-top:4px}
  .stat.free{background:#138808;border-color:#2fbf2f;color:#fff}.stat.free small{color:#d6ffd6}
  .stat.acct{background:linear-gradient(90deg,#ff9933,#ffcc4d);border-color:#ffcc4d;color:#140c02}
  .url{display:inline-block;padding:26px 50px;border-radius:28px;background:#fff;color:#0a2348;font-size:68px;font-weight:900;letter-spacing:-1px;box-shadow:0 30px 90px rgba(0,0,0,.35)}
  .btn{display:inline-flex;align-items:center;gap:14px;margin:12px 10px;padding:24px 34px;border-radius:24px;font-size:34px;font-weight:900}
  .glow{position:absolute;width:1000px;height:1000px;left:40px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 30%,transparent),transparent 65%)}
  #cap{position:absolute;left:60px;right:60px;top:1350px;text-align:center;z-index:9}
  #cap>span{display:inline-block;max-width:960px;font-size:52px;font-weight:800;line-height:1.18;letter-spacing:-.5px;color:var(--capfg)}
  #cap.c0>span{padding:18px 30px;border-radius:22px;background:var(--capbg);border:2px solid var(--cardb)}
  #cap.c1>span{font-size:58px;font-weight:900;text-shadow:0 0 2px #000,3px 3px 0 #000,-3px 3px 0 #000,3px -3px 0 #000,-3px -3px 0 #000,0 6px 24px rgba(0,0,0,.7);color:#fff}
  #cap.c2{text-align:left}
  #cap.c2>span{padding:18px 30px 18px 34px;border-radius:8px 22px 22px 8px;background:var(--capbg);border-left:12px solid var(--ac)}
  #cap.c3>span{padding:14px 22px;border-radius:18px;background:var(--capbg)}
  #cap span i{font-style:normal;color:var(--acx)}
  #cap b{font-weight:900}
  canvas{position:absolute}
  .sh{position:absolute;top:-20%;bottom:-20%;width:34%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);pointer-events:none;z-index:3}
  .wrap{position:absolute;overflow:hidden;border-radius:10px;box-shadow:0 40px 90px rgba(0,0,0,.5)}
  .wrap img{display:block;width:100%}
  .enroll{display:inline-flex;align-items:center;gap:18px;padding:32px 60px;border-radius:999px;background:linear-gradient(90deg,#ff9933,#ffcc4d);color:#140c02;font-size:62px;font-weight:900;letter-spacing:-1px;position:relative;overflow:hidden;font-family:'Inter'}
  .tapc{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:8px solid #fff;z-index:12;box-shadow:0 0 0 4px rgba(0,0,0,.3)}
  .reel{position:absolute;width:420px;height:746px;border-radius:40px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 70%,#0a2348),#071a33 70%);border:4px solid rgba(255,255,255,.25);box-shadow:0 40px 120px rgba(0,0,0,.5);color:#fff}
  .reel .tag{position:absolute;left:24px;top:24px;padding:8px 18px;border-radius:999px;background:rgba(0,0,0,.45);font-size:24px;font-weight:900;letter-spacing:3px}
  .reel .ttl{position:absolute;left:28px;right:28px;bottom:96px;font-size:44px;font-weight:900;line-height:1.08;letter-spacing:-1px;text-shadow:0 4px 20px rgba(0,0,0,.6)}
  .reel .site{position:absolute;left:28px;bottom:36px;font-size:24px;font-weight:800;opacity:.85}
  .play{position:absolute;left:50%;top:38%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#0a2348;font-size:70px}
  .tile{position:absolute;border-radius:30px;background:var(--card);border:2px solid var(--cardb);padding:34px 34px;font-size:40px;font-weight:600;line-height:1.2;overflow:hidden}
  .tile b{font-weight:900}
  .win{position:absolute;border-radius:24px;overflow:hidden;background:#0b1220;border:2px solid #263247;box-shadow:0 40px 100px rgba(0,0,0,.5);color:#e2e8f0}
  .win .tb{height:58px;background:#151e2e;display:flex;align-items:center;gap:12px;padding:0 24px}
  .win .tb i{width:18px;height:18px;border-radius:50%;display:block}
  .win .tb span{margin-left:16px;font:700 22px 'JetBrains Mono',monospace;color:#94a3b8}
  .mono{font-family:'JetBrains Mono',monospace}
  .opt{display:flex;align-items:center;gap:28px;padding:30px 34px;border-radius:28px;background:var(--card);border:3px solid var(--cardb);font-size:44px;font-weight:700;margin-bottom:28px;position:relative}
  .opt .l{flex:none;width:80px;height:80px;border-radius:22px;background:var(--cardb);display:grid;place-items:center;font-size:42px;font-weight:900}
  .opt.ok{background:#138808;border-color:#2fbf2f;color:#fff}.opt.ok .l{background:#fff;color:#138808}
  .opt.no{opacity:.4}
  .big{position:absolute;border-radius:34px;padding:40px 44px;font-size:50px;font-weight:800;line-height:1.18}
  .big small{display:block;font-size:30px;letter-spacing:4px;font-weight:900;margin-bottom:14px}
  .stamp{position:absolute;padding:14px 34px;border:10px solid #ef4444;color:#ef4444;font:900 84px 'Inter';letter-spacing:6px;border-radius:18px;background:rgba(255,255,255,.08)}
  .step{position:absolute;left:190px;right:70px;padding:30px 34px;border-radius:28px;background:var(--card);border:2px solid var(--cardb);font-size:44px;font-weight:600;line-height:1.2}
  .step b{font-weight:900;color:var(--acx)}
  .dot{position:absolute;left:96px;width:64px;height:64px;margin-top:-32px;border-radius:50%;background:var(--ac);color:var(--ink);display:grid;place-items:center;font-size:30px;font-weight:900;box-shadow:0 0 0 10px color-mix(in srgb,var(--ac) 25%,transparent)}
</style></head>
<body>
<div id="bg"></div><div id="grid"></div>
<canvas id="bgfx" width="1080" height="1920" style="left:0;top:0"></canvas>
<div class="tri"><i></i><i></i><i></i></div>
<div id="brand"><img id="logo" alt=""><span><b>Tech Guardians</b><small id="pathlbl"></small></span></div>
<div id="wm">techguardians.in</div>
<div id="bar"><i></i></div>
<canvas id="icon" width="940" height="560" style="left:70px;top:300px"></canvas>
<div id="stage"></div>
<canvas id="fx" width="1080" height="1920" style="left:0;top:0;z-index:10"></canvas>
<div id="cap"></div>
<script>
const D = window.DATA, T = D.topic, A = D.assets, SC = D.scenes;
const LK = Object.assign({ theme: 0, hook: 0, learn: 0, book: 0, ctf: 0, cta: 0, ref: 0, trans: 0, cap: 0, cover: 0, lines: 0 }, T.look || {});
const ORDER = (T.order || ['hook', 'learn', 'book', 'ctf', 'cta', 'ref']).concat(['end']);
const F = T.fact || null;

// ---------- themes ----------
const THEMES = [
  { name: 'navy', bg: 'radial-gradient(1100px 900px at 85% 8%,color-mix(in srgb,var(--ac) 28%,#123a73) 0%,transparent 60%),radial-gradient(900px 900px at 0% 100%,#0e2f5c 0%,transparent 60%),linear-gradient(180deg,#071a33,#0a2348 55%,#061428)', grid: true, hs: 1 },
  { name: 'terminal', bg: 'radial-gradient(900px 900px at 50% 30%,#06301b,transparent 70%),#010805', fg: '#e8fff1', muted: '#86efac', card: 'rgba(16,185,129,.08)', cardb: 'rgba(52,211,153,.38)', capbg: 'rgba(0,12,6,.86)', hf: "'JetBrains Mono'", hs: .86 },
  { name: 'blueprint', bg: 'linear-gradient(180deg,#0b47a8,#083178 60%,#062661)', muted: '#c7dcff', card: 'rgba(255,255,255,.07)', cardb: 'rgba(255,255,255,.55)', capbg: 'rgba(5,28,72,.85)', hf: "'Space Grotesk'", hs: 1 },
  { name: 'neon', bg: 'linear-gradient(180deg,#0b0120 0%,#1d0840 55%,#3b0a5e 100%)', muted: '#f0c8ff', card: 'rgba(255,255,255,.06)', cardb: 'rgba(236,72,153,.5)', capbg: 'rgba(15,2,32,.85)', hf: "'Orbitron'", hs: .74 },
  { name: 'hex', bg: 'radial-gradient(1000px 800px at 20% 10%,color-mix(in srgb,var(--ac) 20%,#0f172a),transparent 65%),linear-gradient(180deg,#0b1220,#111827)', muted: '#cbd5e1', card: 'rgba(148,163,184,.1)', cardb: 'rgba(148,163,184,.28)', capbg: 'rgba(2,6,15,.85)', hf: "'Poppins'", hs: .92 },
  { name: 'paper', bg: 'radial-gradient(900px 700px at 90% 0%,color-mix(in srgb,var(--ac) 22%,#f6f1e7),transparent 70%),#f6f1e7', fg: '#0b1730', muted: '#475569', card: '#ffffff', cardb: 'rgba(11,23,48,.12)', capbg: 'rgba(11,23,48,.9)', capfg: '#fff', hf: "'Playfair Display'", hs: .98, light: true },
  { name: 'bold', bg: '#0d0d0f', muted: '#d4d4d8', card: 'rgba(255,255,255,.06)', cardb: 'rgba(255,255,255,.2)', capbg: 'rgba(0,0,0,.85)', hf: "'Bebas Neue'", hs: 1.3 },
  { name: 'circuit', bg: 'radial-gradient(1000px 900px at 80% 20%,color-mix(in srgb,var(--ac) 18%,#03252b),transparent 70%),#03171b', muted: '#a7f3d0', card: 'rgba(45,212,191,.07)', cardb: 'rgba(45,212,191,.3)', capbg: 'rgba(1,14,16,.86)', hf: "'Oswald'", hs: 1.06 },
];
const TH = THEMES[LK.theme % THEMES.length];
if (TH.light && LK.cap === 1) LK.cap = 0;   // outlined captions read badly on the light theme
const R = document.documentElement.style;
R.setProperty('--ac', T.accent);
if (TH.fg) R.setProperty('--fg', TH.fg);
for (const [k, v] of [['muted', TH.muted], ['card', TH.card], ['cardb', TH.cardb], ['capbg', TH.capbg], ['capfg', TH.capfg], ['hf', TH.hf]]) if (v) R.setProperty('--' + k, v);
if (TH.light) R.setProperty('--acx', 'color-mix(in srgb,var(--ac) 62%,#000)');
document.body.classList.add('th' + LK.theme);
document.getElementById('bg').style.background = TH.bg;
document.getElementById('grid').style.display = TH.grid ? 'block' : 'none';
const FG = TH.fg || '#ffffff';
const fs = (n) => Math.round(n * TH.hs);

document.getElementById('logo').src = A.logo;
document.getElementById('pathlbl').textContent = `Room ${T.num} · ${T.path}`;

const ease = (x) => x < 0 ? 0 : x > 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = (x) => { x = Math.max(0, Math.min(1, x)); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const keys = (k, t) => { if (t <= k[0][0]) return k[0][1]; for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const [a, va] = k[i - 1], [b, vb] = k[i]; return va + (vb - va) * ease((t - a) / (b - a)); } return k[k.length - 1][1]; };
const fadeUp = (lt, at, d = .55, y = 50) => { const p = ease(clamp((lt - at) / d)); return `opacity:${p};transform:translateY(${(1 - p) * y}px)`; };
const fadeX = (lt, at, d = .55, x = 120) => { const p = ease(clamp((lt - at) / d)); return `opacity:${p};transform:translateX(${(1 - p) * x}px)`; };
const pop = (lt, at, d = .5) => { const p = clamp((lt - at) / d); return `opacity:${clamp(p * 2)};transform:scale(${.6 + .4 * back(p)})`; };
const clip = (s) => D.clips.find((c) => c.scene === s);
const M = D.marks;
const shine = (lt, at, d = .9) => { const p = (lt - at) / d; return p > 0 && p < 1 ? `<i class="sh" style="left:${-40 + p * 150}%"></i>` : ''; };
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const strip = (h) => h.replace(/<[^>]+>/g, '');
const V = LK.lines;   // wording variant for small labels
const imgs = {};
for (const k of ['cover', 'feature', 'room', 'task', 'logo', 'refcover']) { if (!A[k]) continue; const i = new Image(); i.src = A[k]; imgs[k] = i; }

// ---------- topic animations (canvas 940x560 above the hook) ----------
const cv = document.getElementById('icon'), g = cv.getContext('2d');
const AC = T.accent, RED = '#ef4444', GRN = '#22c55e';
const alpha = (c, a) => c + Math.round(clamp(a) * 255).toString(16).padStart(2, '0');
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function packet(x, y, col, r = 22) { g.fillStyle = col; g.shadowColor = col; g.shadowBlur = 24; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.shadowBlur = 0; }
function txt(s, x, y, font, col, al = 'center') { g.font = font; g.fillStyle = col; g.textAlign = al; g.fillText(s, x, y); }
function line(x1, y1, x2, y2, col, w = 3) { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function shieldPath(cx, cy, s) { g.beginPath(); g.moveTo(cx, cy - 1.1 * s); g.quadraticCurveTo(cx + .95 * s, cy - .85 * s, cx + .95 * s, cy - .5 * s); g.quadraticCurveTo(cx + .95 * s, cy + .6 * s, cx, cy + 1.15 * s); g.quadraticCurveTo(cx - .95 * s, cy + .6 * s, cx - .95 * s, cy - .5 * s); g.quadraticCurveTo(cx - .95 * s, cy - .85 * s, cx, cy - 1.1 * s); g.closePath(); }
const ICONS = {
  firewall(t) {
    const wx = 430;
    for (let r = 0; r < 7; r++) for (let c = 0; c < 2; c++) {
      const off = r % 2 ? 40 : 0; rr(wx + c * 80 - off + 20, 60 + r * 64, 76, 58, 8);
      g.fillStyle = r % 2 ? '#c2410c' : '#ea580c'; g.fill(); g.strokeStyle = '#7c2d12'; g.lineWidth = 3; g.stroke();
    }
    txt('FIREWALL', wx + 80, 40, '800 30px Inter', FG);
    for (let i = 0; i < 6; i++) {
      const ph = ((t * .55 + i / 6) % 1), lane = 110 + (i % 4) * 110, good = i % 2 === 0;
      let x = -40 + ph * 1040;
      if (!good && x > wx - 10) { const k = (x - (wx - 10)) / 300; x = wx - 10 - k * 220; packet(x, lane + k * 40, `rgba(239,68,68,${1 - k})`); if (k < .35) txt('✕', wx - 60, lane - 30, '900 44px Inter', FG); continue; }
      packet(x, lane, good ? GRN : RED);
    }
    txt('● allow 443', 20, 530, '700 26px Inter', '#16a34a', 'left'); txt('● deny 23', 230, 530, '700 26px Inter', RED, 'left');
  },
  packets(t) {
    for (let l = 0; l < 4; l++) {
      const y = 90 + l * 110; line(20, y, 920, y, alpha(FG, .15), 2);
      for (let k = 0; k < 5; k++) {
        const x = ((t * (120 + l * 30) + k * 210 + l * 60) % 1020) - 40, bad = l === 2 && k === 1;
        rr(x - 40, y - 22, 80, 44, 10); g.fillStyle = bad ? RED : ['#22d3ee', '#38bdf8', '#60a5fa', '#818cf8'][l]; g.fill();
        txt(bad ? 'SYN' : ['TCP', 'DNS', 'HTTP', 'TLS'][l], x, y + 7, '800 20px JetBrains Mono', '#04121f');
      }
    }
    const mx = 470 + Math.sin(t * 1.3) * 300, my = 260 + Math.cos(t * .9) * 90;
    g.lineWidth = 14; g.strokeStyle = FG; g.beginPath(); g.arc(mx, my, 90, 0, 7); g.stroke();
    g.fillStyle = 'rgba(34,211,238,.12)'; g.fill(); g.lineWidth = 22; g.beginPath(); g.moveTo(mx + 64, my + 64); g.lineTo(mx + 140, my + 140); g.stroke();
  },
