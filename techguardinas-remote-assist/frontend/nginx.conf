server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }
    # Single-page application routes (/join/<code>, /console/<id>, ...)
    location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
}
