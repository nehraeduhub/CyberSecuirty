<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Status | DC Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276%27 fill=%27%2300e5d4%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body class="status-page">
  <header class="topbar">
    <div class="brand">DC Viewer</div>
    <nav class="nav" aria-label="Views">
        <a href="index.html">Monitor</a>
        <a href="devices.html">Manage devices</a>
        <a href="scan.html">Scan &amp; settings</a>
        <a href="status.html" data-feature="grafana" aria-current="page">Status</a>
      </nav>
    <div class="seg" role="group" aria-label="Dashboard">
      <button type="button" data-dash="dc-device-status/device-status" aria-pressed="true">Up / down</button>
      <button type="button" data-dash="dc-network-health/network-and-hardware" aria-pressed="false">Network &amp; hardware</button>
    </div>
    <div class="spacer"></div>
    <a id="grafana-open" class="btn ghost" target="_blank" rel="noopener">Open in Grafana</a>
  </header>
  <iframe id="grafana" class="status-frame" title="Device status dashboard (Grafana)"></iframe>
  <script src="dc.js"></script>
  <script>
    window.DC.applyFeatures();
    (function () {
      var cfg = window.DC_VIEWER_CONFIG || {};
      var base = (cfg.grafanaPath || '../grafana/').replace(/\/?$/, '/');
      var buttons = document.querySelectorAll('[data-dash]');

      function show(path) {
        var dash = base + 'd/' + path + '?orgId=1';
        document.getElementById('grafana').src = dash + '&kiosk';
        document.getElementById('grafana-open').href = dash;
        buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.dash === path)); });
        try { history.replaceState(null, '', '#' + path.split('/')[0]); } catch (e) { /* ignore */ }
      }

      buttons.forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.dash); }); });
      var wanted = location.hash.slice(1);
      var start = Array.prototype.find.call(buttons, function (b) { return b.dataset.dash.indexOf(wanted + '/') === 0; });
      show((start || buttons[0]).dataset.dash);
    })();
  </script>
</body>
</html>
