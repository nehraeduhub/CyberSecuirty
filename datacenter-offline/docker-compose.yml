# NehraEduHub offline data centre stack
#   glpi    - GLPI asset manager (main GUI, rack/room views, inventory endpoint)
#   db      - MariaDB database for GLPI
#   portal  - nginx serving the learning library + DC Viewer, and proxying the GLPI REST API
#   collector - scheduled network collection (SNMP, SSH/WinRM, VMware) pushed into GLPI
#   monitor-sync, prometheus, blackbox, snmp-exporter, grafana - monitoring: every
#             device in GLPI with an IP is pinged; network devices are also polled
#             over SNMP (ports, uptime, vendor health); Grafana shows the dashboards
#
# All images are pinned so the same versions can be saved into an offline bundle.
name: dc

services:
  glpi:
    image: "glpi/glpi:${GLPI_VERSION:-11.0.11}"
    restart: unless-stopped
    env_file: .env
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: 3306
    volumes:
      - glpi_data:/var/glpi
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GLPI_PORT:-80}:80"

  db:
    image: "mariadb:${MARIADB_VERSION:-11.4}"
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: ${GLPI_DB_NAME}
      MARIADB_USER: ${GLPI_DB_USER}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  portal:
    image: "nginx:${NGINX_VERSION:-1.27-alpine}"
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./nginx/snippets:/etc/nginx/snippets:ro,z
      - ./viewer:/usr/share/nginx/html/viewer:ro,z
      - collector_status:/usr/share/nginx/html/collector:ro
      - ../index.html:/usr/share/nginx/html/index.html:ro,z
      - ../glpi-datacenter-library.html:/usr/share/nginx/html/glpi-datacenter-library.html:ro,z
      - ../Cyber Security Overview.jpg:/usr/share/nginx/html/Cyber Security Overview.jpg:ro,z
      - ../IT Lab Image.jpg:/usr/share/nginx/html/IT Lab Image.jpg:ro,z
      - ../Cybersecurity Certification.jpg:/usr/share/nginx/html/Cybersecurity Certification.jpg:ro,z
      - ../Online Course Training.jpg:/usr/share/nginx/html/Online Course Training.jpg:ro,z
    depends_on:
      - glpi
      - grafana
    ports:
      - "${PORTAL_PORT:-8080}:80"

  collector:
    image: "dc-collector:${AGENT_VERSION:-1.17}"
    build:
      context: ./collector
      args:
        AGENT_VERSION: ${AGENT_VERSION:-1.17}
    restart: unless-stopped
    environment:
      GLPI_URL: http://glpi/
    volumes:
      - ./collector/collector.conf:/etc/collector/collector.conf:ro,z
      - ./collector/ssh:/root/.ssh:z
      - collector_status:/status
    depends_on:
      - glpi

  # GLPI devices -> Prometheus ping targets (reuses the collector image's Perl)
  monitor-sync:
    image: "dc-collector:${AGENT_VERSION:-1.17}"
    restart: unless-stopped
    entrypoint: ["perl", "/opt/glpi-targets.pl"]
    environment:
      GLPI_URL: http://glpi
      GLPI_PUBLIC_URL: ${GLPI_PUBLIC_URL:-}
      GLPI_USER: dc-monitor
      GLPI_PASSWORD: ${MONITOR_GLPI_PASSWORD:-}
      SYNC_MINUTES: ${MONITOR_SYNC_MINUTES:-5}
      EXCLUDE_STATES: ${MONITOR_EXCLUDE_STATES:-}
    volumes:
      - ./monitoring/targets/glpi-targets.pl:/opt/glpi-targets.pl:ro,z
      - ./collector/collector.conf:/etc/collector/collector.conf:ro,z
      - monitor_targets:/targets
      - snmp_auth:/snmp
    depends_on:
      - glpi

  blackbox:
    image: "prom/blackbox-exporter:${BLACKBOX_VERSION:-v0.28.0}"
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro,z

  # SNMP polling: built-in modules (if_mib, system, sophos_xg, cisco_device, hpe,
  # dell, dell_network) + credentials generated by monitor-sync
  snmp-exporter:
    image: "prom/snmp-exporter:${SNMP_EXPORTER_VERSION:-v0.30.1}"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until [ -s /snmp/auth.yml ]; do sleep 2; done;
        exec /bin/snmp_exporter --config.file=/etc/snmp_exporter/snmp.yml --config.file=/snmp/auth.yml
    volumes:
      - snmp_auth:/snmp:ro

  prometheus:
    image: "prom/prometheus:${PROMETHEUS_VERSION:-v3.5.5}"
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./monitoring/manual:/etc/prometheus/manual:ro,z
      - monitor_targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    depends_on:
      - blackbox
      - snmp-exporter

  grafana:
    image: "grafana/grafana-oss:${GRAFANA_VERSION:-13.0.2}"
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8080/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/device-status.json
      # Offline: no update checks, news feed or plugin downloads
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  glpi_data:
  db_data:
  collector_status:
  monitor_targets:
  prometheus_data:
  snmp_auth:
  grafana_data:
