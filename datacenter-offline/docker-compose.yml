# NehraEduHub offline DC monitoring stack (DC NOC)
#   portal    - nginx: the DC Viewer (Monitor, Manage devices, Scan & settings, SSH),
#               learning library and Grafana, over HTTPS
#   manager   - API behind the DC Viewer: device list (devices.json), settings, status,
#               scan now, browser SSH
#   collector - scheduled network scans (SNMP, optional SSH/WinRM and VMware) that
#               fill the device list
#   monitor-sync, prometheus, blackbox, snmp-exporter, grafana - monitoring: every
#               device is pinged; network devices are also polled over SNMP (ports,
#               uptime, vendor health); Grafana shows the dashboards
#
# All images are pinned so the same versions can be saved into an offline bundle.
name: dc

services:
  portal:
    image: "nginx:${NGINX_VERSION:-1.27-alpine}"
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./nginx/snippets:/etc/nginx/snippets:ro,z
      - ./viewer:/usr/share/nginx/html/viewer:ro,z
      - collector_status:/usr/share/nginx/html/collector:ro
      - ../index.html:/usr/share/nginx/html/index.html:ro,z
      - ../glpi-datacenter-library.html:/usr/share/nginx/html/glpi-datacenter-library.html:ro,z
      - ../Cyber Security Overview.jpg:/usr/share/nginx/html/Cyber Security Overview.jpg:ro,z
      - ../IT Lab Image.jpg:/usr/share/nginx/html/IT Lab Image.jpg:ro,z
      - ../Cybersecurity Certification.jpg:/usr/share/nginx/html/Cybersecurity Certification.jpg:ro,z
      - ../Online Course Training.jpg:/usr/share/nginx/html/Online Course Training.jpg:ro,z
    depends_on:
      - grafana
      - manager
    ports:
      - "${PORTAL_PORT:-8080}:80"

  collector:
    image: "dc-collector:${AGENT_VERSION:-1.17}"
    build:
      context: ./collector
      args:
        AGENT_VERSION: ${AGENT_VERSION:-1.17}
    restart: unless-stopped
    environment:
      MANAGER_URL: http://manager:8090
    volumes:
      - ./collector/collector.conf:/etc/collector/collector.conf:ro,z
      # The kit's copies, so script updates apply without rebuilding the image
      - ./collector/collect.sh:/usr/local/bin/collect.sh:ro,z
      - ./collector/settings-env.pl:/usr/local/bin/settings-env.pl:ro,z
      - ./collector/to-devices.pl:/usr/local/bin/to-devices.pl:ro,z
      - ./collector/ssh:/root/.ssh:z
      - collector_status:/status
      - dc_settings:/settings:ro
    depends_on:
      - manager

  # Device list -> Prometheus ping and SNMP targets (reuses the collector image's Perl)
  monitor-sync:
    image: "dc-collector:${AGENT_VERSION:-1.17}"
    restart: unless-stopped
    entrypoint: ["perl", "/opt/monitor-sync.pl"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      SYNC_MINUTES: ${MONITOR_SYNC_MINUTES:-5}
    volumes:
      - ./monitoring/targets/monitor-sync.pl:/opt/monitor-sync.pl:ro,z
      - ./collector/collector.conf:/etc/collector/collector.conf:ro,z
      - monitor_targets:/targets
      - snmp_auth:/snmp
      - dc_settings:/settings
    depends_on:
      - manager

  # DC Viewer API (/api/): device list, settings, status, scan now, browser SSH.
  # Reuses the collector image's Perl.
  manager:
    image: "dc-collector:${AGENT_VERSION:-1.17}"
    restart: unless-stopped
    entrypoint: ["perl", "/opt/manager.pl"]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ./manager/manager.pl:/opt/manager.pl:ro,z
      - ./scripts/discover-networks.pl:/opt/discover-networks.pl:ro,z
      - dc_settings:/settings
      - collector_status:/status

  blackbox:
    image: "prom/blackbox-exporter:${BLACKBOX_VERSION:-v0.28.0}"
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro,z

  # SNMP polling: built-in modules (if_mib, system, sophos_xg, cisco_device, hpe,
  # dell, dell_network) + credentials generated by monitor-sync
  snmp-exporter:
    image: "prom/snmp-exporter:${SNMP_EXPORTER_VERSION:-v0.30.1}"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until [ -s /snmp/auth.yml ]; do sleep 2; done;
        exec /bin/snmp_exporter --config.file=/etc/snmp_exporter/snmp.yml --config.file=/snmp/auth.yml
    volumes:
      - snmp_auth:/snmp:ro

  prometheus:
    image: "prom/prometheus:${PROMETHEUS_VERSION:-v3.5.5}"
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./monitoring/manual:/etc/prometheus/manual:ro,z
      - monitor_targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    depends_on:
      - blackbox
      - snmp-exporter

  grafana:
    image: "grafana/grafana-oss:${GRAFANA_VERSION:-13.0.2}"
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8080/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/device-status.json
      # Offline: no update checks, news feed or plugin downloads
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  collector_status:
  monitor_targets:
  prometheus_data:
  snmp_auth:
  grafana_data:
  dc_settings:
