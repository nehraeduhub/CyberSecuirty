modules:
  # Default: is the device answering ping?
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4

  # Port open? Use with a "module: tcp_connect" label and target host:port
  tcp_connect:
    prober: tcp
    timeout: 5s

  # Web page / management UI returns 2xx (self-signed certificates allowed)
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true

  # SSH answering with a banner
  ssh_banner:
    prober: tcp
    timeout: 5s
    tcp:
      query_response:
        - expect: "^SSH-2.0-"
