server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Learning library and DC Viewer (static, works fully offline)
    location / {
        try_files $uri $uri/ =404;
    }

    # Collector status for the dashboard (never cached)
    location /collector/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # GLPI REST API proxied on the same origin so the DC Viewer needs no CORS
    location /apirest.php {
        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
}
