# HTTPS mode (docker-compose.tls.yml):
#   443  -> GLPI
#   8443 -> portal: DC Viewer, learning library, Grafana, GLPI API for the viewer
#   80   -> redirect to HTTPS
# (container ports; the host ports are HTTPS_PORT, PORTAL_TLS_PORT and
#  HTTP_REDIRECT_PORT in .env - the redirect snippets carry the host ports)
# Certificate: tls/server.crt + tls/server.key (yours, or generated by install-offline.sh)

server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/snippets/redirect-glpi.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    include /etc/nginx/snippets/tls-params.conf;

    client_max_body_size 100m;

    location / {
        proxy_pass http://glpi:80;
        # $http_host keeps the port the browser used (HTTPS_PORT may not be 443)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    include /etc/nginx/snippets/tls-params.conf;
    # plain HTTP sent to the HTTPS port
    include /etc/nginx/snippets/redirect-portal.conf;

    include /etc/nginx/snippets/portal.conf;
}
