# HTTPS mode (docker-compose.tls.yml):
#   443  -> GLPI
#   8443 -> portal: DC Viewer, learning library, Grafana, GLPI API for the viewer
#   80   -> redirect to HTTPS
# Certificate: tls/server.crt + tls/server.key (yours, or generated by install-offline.sh)

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    include /etc/nginx/snippets/tls-params.conf;

    client_max_body_size 100m;

    location / {
        proxy_pass http://glpi:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 300s;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    include /etc/nginx/snippets/tls-params.conf;
    # plain HTTP sent to the HTTPS port
    error_page 497 =301 https://$host:$server_port$request_uri;

    include /etc/nginx/snippets/portal.conf;
}
