# Portal content shared by the HTTP (default.conf) and HTTPS (tls.conf) servers
root /usr/share/nginx/html;
index index.html;

# Learning library and DC Viewer (static, works fully offline)
location / {
    try_files $uri $uri/ =404;
}

# Collector status for the dashboard (never cached)
location /collector/ {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# Grafana (device status dashboards), served under /grafana/
location /grafana/ {
    proxy_pass http://grafana:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Grafana live updates (websocket)
location /grafana/api/live/ {
    proxy_pass http://grafana:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
}

# DC Viewer management API (settings, device status, scan now)
location /api/ {
    proxy_pass http://manager:8090;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    client_max_body_size 1m;
}

# GLPI REST API proxied on the same origin so the DC Viewer needs no CORS
location /apirest.php {
    proxy_pass http://glpi:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy same-origin always;
