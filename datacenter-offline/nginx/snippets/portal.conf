# Portal content shared by the HTTP (default.conf) and HTTPS (tls.conf) servers
root /usr/share/nginx/html;
index index.html;

# Look container addresses up at request time (Docker's DNS), so a restarted
# manager or Grafana container is found again without restarting the portal
resolver 127.0.0.11 valid=10s ipv6=off;
set $manager http://manager:8090;
set $grafana http://grafana:3000;

# Learning library and DC Viewer (static, works fully offline)
location / {
    try_files $uri $uri/ =404;
}

# Collector status for the dashboard (never cached)
location /collector/ {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

# Grafana (device status dashboards), served under /grafana/
location /grafana/ {
    proxy_pass $grafana;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Grafana live updates (websocket)
location /grafana/api/live/ {
    proxy_pass $grafana;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
}

# Web SSH terminal (WebSocket to the manager)
location = /api/ssh {
    proxy_pass $manager;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 2h;
    proxy_send_timeout 2h;
}

# DC Viewer management API (settings, device status, scan now)
location /api/ {
    proxy_pass $manager;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    client_max_body_size 1m;
}

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy same-origin always;
