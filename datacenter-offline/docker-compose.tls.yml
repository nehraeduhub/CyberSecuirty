# HTTPS mode. Enabled by COMPOSE_FILE=docker-compose.yml:docker-compose.tls.yml
# in .env (install-offline.sh sets it when TLS=yes).
#   https://<server>[:HTTPS_PORT]/  DC NOC (opens the Monitor)    (HTTPS_PORT, default 443)
#   https://<server>:8443/          website, library, DC Viewer, Grafana (PORTAL_TLS_PORT)
#   http://<server>[:80]/           redirect to HTTPS             (HTTP_REDIRECT_PORT)
services:
  portal:
    ports: !override
      - "${HTTP_REDIRECT_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${PORTAL_TLS_PORT:-8443}:8443"
    volumes:
      - ./nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./tls:/etc/nginx/tls:ro,z
