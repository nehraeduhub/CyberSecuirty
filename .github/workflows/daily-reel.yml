name: Daily Cyber Fraud Reel

on:
  schedule:
    # 02:07 UTC = 07:37 AM IST, every day
    - cron: "7 2 * * *"
  workflow_dispatch: {}   # "Run workflow" button for manual run

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, fonts, rclone
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core rclone

      - name: Install Python packages
        run: pip install -r reel_bot/requirements.txt

      - name: Make today's reel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python reel_bot/main.py --out reels

      - name: Save reel in GitHub (reels/ folder)
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add reels
          git commit -m "Daily reel $(date +%F)" || echo "nothing to commit"
          git push

      - name: Upload to Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER || 'Cyber Safe Jhunjhunu Reels' }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone copy reels "gdrive:$DRIVE_FOLDER" --progress
          rm -f ~/.config/rclone/rclone.conf
