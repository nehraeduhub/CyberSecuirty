name: Upload reels to Google Drive

# Runs whenever a new reel is pushed into the reels/ folder (any branch),
# or manually from the Actions tab.
on:
  push:
    paths:
      - "reels/**"
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: sudo apt-get update -y && sudo apt-get install -y rclone

      - name: Copy reels to Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER || 'Cyber Safe Jhunjhunu Reels' }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "::error::RCLONE_CONF secret missing. See reel_bot/README.md (Step 2)."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          # copy = only new/changed files are uploaded, nothing is deleted from Drive
          rclone copy reels "gdrive:$DRIVE_FOLDER" --progress
          rm -f ~/.config/rclone/rclone.conf
